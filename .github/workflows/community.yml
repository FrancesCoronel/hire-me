name: Community

# pull_request_target is safe here: the job only labels the PR and never
# checks out or runs the contributor's code.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened]

jobs:
  triage:
    uses: FrancesCoronel/workflows/.github/workflows/community-triage.yml@v1
    permissions:
      pull-requests: write
      issues: write
